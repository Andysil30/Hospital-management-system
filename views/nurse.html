<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nurse portal · AfyaCare Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="role-nurse" data-page-i18n="off">
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/nurse"><svg class="logo-mark" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#fff"/><path d="M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z" fill="#c65a3a"/></svg><span><span>AfyaCare Clinic</span><small class="d-block" style="font-family:var(--bs-body-font-family);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7">Nurse portal</small></span></a>
    <div class="side-label">Menu</div>
    <ul class="nav flex-column sidebar-nav" role="tablist">
      <li class="nav-item"><button class="nav-link active" id="t-queue" data-bs-toggle="tab" data-bs-target="#p-queue" type="button" role="tab"><svg class="nav-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/></svg><span>Triage queue</span></button></li>
    </ul>
    <div class="sidebar-foot"><button class="nav-link" data-action="logout"><svg class="nav-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Log out</span></button></div>
  </aside>
  <div class="app-main">
    <header class="app-top">
      <div><h1 id="greeting"></h1><p class="app-sub">Record vitals so the doctor is ready when the patient walks in.</p></div>
      <div class="app-top-tools"><span class="date-chip"><svg class="" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="today"></span></span>
        <span class="user-chip"><span class="avatar-sm" id="avatar" aria-hidden="true"></span><span id="who"></span></span></div>
    </header>
    <main class="app-content">
      <div class="tab-content">
        <div class="tab-pane fade show active" id="p-queue" role="tabpanel">
          <div class="kpis mb-4" id="n-kpis"></div>
          <div class="panel">
            <h2>Triage queue</h2>
            <div class="panel-sub">Patients booked for today. Record their vitals before they see the doctor; the doctor sees them on screen. The list refreshes by itself.</div>
            <div class="table-wrap"><table class="table align-middle mb-0">
              <thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Vitals</th><th class="text-end"></th></tr></thead>
              <tbody id="n-table"></tbody></table></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="modal fade" id="vitalsModal" tabindex="-1" aria-labelledby="vitalsTitle" aria-hidden="true">
  <div class="modal-dialog"><form class="modal-content" id="vitals-form" novalidate>
    <div class="modal-header"><h2 class="modal-title h5" id="vitalsTitle">Record vitals</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body row g-3">
      <input type="hidden" id="v-appt">
      <div class="col-6"><label class="form-label" for="v-sys">Blood pressure, top (mmHg)</label><input class="form-control" id="v-sys" type="number" min="40" max="300" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label" for="v-dia">Blood pressure, bottom</label><input class="form-control" id="v-dia" type="number" min="20" max="200" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label" for="v-temp">Temperature (&deg;C)</label><input class="form-control" id="v-temp" type="number" step="0.1" min="30" max="45" inputmode="decimal"></div>
      <div class="col-6"><label class="form-label" for="v-pulse">Pulse (beats per minute)</label><input class="form-control" id="v-pulse" type="number" min="20" max="260" inputmode="numeric"></div>
      <div class="col-6"><label class="form-label" for="v-kg">Weight (kg)</label><input class="form-control" id="v-kg" type="number" step="0.1" min="0.5" max="400" inputmode="decimal"></div>
      <div class="col-6"><label class="form-label" for="v-spo2">Oxygen saturation (%)</label><input class="form-control" id="v-spo2" type="number" min="50" max="100" inputmode="numeric"></div>
      <div class="col-12"><label class="form-label" for="v-notes">Notes for the doctor (optional)</label><textarea class="form-control" id="v-notes" rows="2" maxlength="500"></textarea></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save vitals</button></div>
  </form></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/bot.js"></script>
<script src="/assets/js/nurse.js"></script>
</body>
</html>
